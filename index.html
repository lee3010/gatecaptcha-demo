<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GateCaptcha — live demo</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #ffffff;
    --ink: #1a1d23;
    --muted: #6b7280;
    --track-bg: #e9ecf2;
    --track-fill: #3d6bff;
    --success: #2fb170;
    --failure: #e5484d;
    --border: #e3e6ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .puzzle {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: var(--track-bg);
    user-select: none;
  }
  .puzzle img.bg { display: block; width: 100%; height: auto; }
  .puzzle img.piece {
    position: absolute;
    top: 0;
    left: 0;
    cursor: grab;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    touch-action: none;
  }
  .puzzle img.piece:active { cursor: grabbing; }
  .banner {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .banner.show { transform: translateY(0); }
  .banner.success { background: var(--success); }
  .banner.failure { background: var(--failure); }
  .track {
    position: relative;
    margin-top: 14px;
    height: 44px;
    border-radius: 22px;
    background: var(--track-bg);
    overflow: hidden;
  }
  .track .fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0;
    background: var(--track-fill);
    border-radius: 22px 0 0 22px;
  }
  .track .fill.failure { background: var(--failure); }
  .track .hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .track .handle {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
  }
  .track .handle:active { cursor: grabbing; }
  .track .handle svg { width: 18px; height: 18px; }
  .status { margin-top: 12px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.err { color: var(--failure); }
  footer { margin-top: 20px; font-size: 11px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="card">
    <h1>GateCaptcha</h1>
    <p class="sub">Slide the piece into place to verify.</p>

    <div class="puzzle" id="puzzle">
      <img class="bg" id="bgImg" alt="" />
      <img class="piece" id="pieceImg" alt="" />
      <div class="banner" id="banner"></div>
    </div>

    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="hint" id="hint">Drag to verify</div>
      <div class="handle" id="handle">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6l6 6-6 6" stroke="#374151" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <p class="status" id="status">Loading challenge…</p>

    <footer>GateCaptcha — self-hosted puzzle captcha. <a href="https://github.com" target="_blank" rel="noopener">Source on request</a>.</footer>
  </div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const state = {
    baseUrl: qs.get('baseUrl') || localStorage.getItem('gc_baseUrl') || 'https://gapi.oppay88.com',
    captchaId: qs.get('captchaId') || localStorage.getItem('gc_captchaId') || '3b18936e5d56',
    challenge: null,
    dragging: false,
    startX: 0,
    offsetX: 0,
    trail: [],
    startedAt: 0,
    maxOffset: 0,
    busy: false,
  };

  const el = {
    puzzle: document.getElementById('puzzle'),
    bgImg: document.getElementById('bgImg'),
    pieceImg: document.getElementById('pieceImg'),
    banner: document.getElementById('banner'),
    track: document.getElementById('track'),
    fill: document.getElementById('fill'),
    hint: document.getElementById('hint'),
    handle: document.getElementById('handle'),
    status: document.getElementById('status'),
  };

  function setStatus(msg, isErr) {
    el.status.textContent = msg;
    el.status.classList.toggle('err', !!isErr);
  }

  async function api(path, options) {
    const res = await fetch(state.baseUrl + path, Object.assign({
      headers: Object.assign({ 'X-Captcha-Id': state.captchaId, 'Content-Type': 'application/json' }, (options && options.headers) || {}),
    }, options));
    const body = await res.json().catch(() => null);
    if (!res.ok || !body || body.isSuccess === false) {
      const msg = (body && body.errorMessage) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return body.data;
  }

  async function loadChallenge() {
    if (!state.captchaId) {
      setStatus('Demo is not configured.', true);
      return;
    }
    setStatus('Loading challenge…');
    resetDrag();
    try {
      const data = await api('/v1/challenge', { method: 'POST', body: '{}' });
      state.challenge = data;
      el.bgImg.src = 'data:image/png;base64,' + data.backgroundImageBase64;
      el.pieceImg.src = 'data:image/png;base64,' + data.pieceImageBase64;
      el.puzzle.style.aspectRatio = data.canvasWidth + ' / ' + data.canvasHeight;
      // The background is stretched to fill the card (CSS width 100%), so the
      // piece has to be scaled by the same factor or it won't match the notch size.
      const renderScale = el.puzzle.clientWidth / data.canvasWidth;
      el.pieceImg.style.top = (data.pieceY * renderScale) + 'px';
      el.pieceImg.style.width = (data.pieceWidth * renderScale) + 'px';
      el.pieceImg.style.height = (data.pieceHeight * renderScale) + 'px';
      state.maxOffset = el.track.clientWidth - el.handle.clientWidth - 4;
      setStatus('Drag the handle until the piece fits.');
    } catch (e) {
      setStatus('Failed to load challenge: ' + e.message, true);
    }
  }

  function resetDrag() {
    state.offsetX = 0;
    state.trail = [];
    el.fill.style.width = '0px';
    el.fill.classList.remove('failure');
    el.handle.style.transform = 'translateX(0px)';
    el.pieceImg.style.transform = 'translateX(0px)';
    el.banner.classList.remove('show', 'success', 'failure');
    el.hint.style.opacity = '1';
  }

  function onDragStart(clientX) {
    if (state.busy || !state.challenge) return;
    state.dragging = true;
    state.startX = clientX;
    state.startedAt = performance.now();
    state.trail = [{ x: 0, t: 0 }];
    el.hint.style.opacity = '0';
  }

  function onDragMove(clientX) {
    if (!state.dragging) return;
    const scale = (state.challenge.canvasWidth) / el.puzzle.clientWidth;
    let dx = clientX - state.startX;
    const maxPiece = el.puzzle.clientWidth - el.pieceImg.clientWidth;
    dx = Math.max(0, Math.min(dx, maxPiece));
    state.offsetX = dx * scale;
    el.pieceImg.style.transform = 'translateX(' + dx + 'px)';

    const trackDx = Math.max(0, Math.min(dx / maxPiece * state.maxOffset, state.maxOffset));
    el.handle.style.transform = 'translateX(' + trackDx + 'px)';
    el.fill.style.width = (trackDx + 2 + el.handle.clientWidth) + 'px';
    state.trail.push({ x: state.offsetX, t: performance.now() - state.startedAt });
  }

  async function onDragEnd() {
    if (!state.dragging) return;
    state.dragging = false;
    state.busy = true;
    try {
      const res = await api('/v1/challenge/' + state.challenge.challengeId + '/verify', {
        method: 'POST',
        body: JSON.stringify({ offsetX: state.offsetX, dragTrail: state.trail }),
      });
      if (res.success) {
        el.banner.textContent = 'Verified' + (res.captchaToken ? ' — token issued' : '');
        el.banner.classList.add('show', 'success');
        setStatus('Success. A real single-use token was issued server-side.');
        setTimeout(loadChallenge, 1600);
      } else {
        el.fill.classList.add('failure');
        el.banner.textContent = 'Not quite — try again';
        el.banner.classList.add('show', 'failure');
        setStatus('Verification failed.', true);
        setTimeout(loadChallenge, 1200);
      }
    } catch (e) {
      setStatus('Error: ' + e.message, true);
      setTimeout(loadChallenge, 1200);
    } finally {
      state.busy = false;
    }
  }

  el.handle.addEventListener('mousedown', (e) => onDragStart(e.clientX));
  window.addEventListener('mousemove', (e) => onDragMove(e.clientX));
  window.addEventListener('mouseup', onDragEnd);

  el.handle.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
  window.addEventListener('touchmove', (e) => { if (state.dragging) onDragMove(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchend', onDragEnd);

  loadChallenge();
})();
</script>
</body>
</html>
